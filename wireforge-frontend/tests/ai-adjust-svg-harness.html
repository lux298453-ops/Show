<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SVG background adjustment verification</title></head><body><div id="app"></div>
<script type="module">
import { createApp, h } from 'vue'
import { createRouter, createMemoryHistory, RouterView } from 'vue-router'
import ElementPlus from 'element-plus'
import 'element-plus/dist/index.css'
import '../src/styles/main.scss'
import PurePreviewView from '../src/views/PurePreviewView.vue'
import { projectApi } from '../src/api/project'

// Real source/result files from the opt-in backend check. Save and AI calls stay local.
const fixtureOrigin = 'http://127.0.0.1:8766'
const [source, result] = await Promise.all([
  fetch(`${fixtureOrigin}/page-2464-before.html`).then(r => { if (!r.ok) throw new Error('Source fixture unavailable'); return r.text() }),
  fetch(`${fixtureOrigin}/live-adjustment-response.json`).then(r => { if (!r.ok) throw new Error('Adjustment fixture unavailable'); return r.json() }),
])
const pages = [{ id: 2464, name: '宠物家园首页', background_image: '', canvas_width: 375, canvas_height: 833,
  analyzed: 1, html_content: source, elements: [], annotations: [] }]
const saves = [], requests = []
projectApi.prototype = async () => ({ project: { id: 700002, name: 'SVG 背景调整隔离验证' }, pages: structuredClone(pages) })
projectApi.aiAdjust = async (...args) => { requests.push(args); return result }
projectApi.saveHtml = async (...args) => { saves.push(args); pages[0].html_content = args[2] }
window.svgAdjustmentFixture = { source, result, pages, saves, requests }
const router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/projects/:id/preview', component: PurePreviewView }] })
await router.push('/projects/700002/preview')
createApp({ render: () => h(RouterView) }).use(router).use(ElementPlus).mount('#app')
</script></body></html>
