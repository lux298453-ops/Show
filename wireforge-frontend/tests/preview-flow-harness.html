<!doctype html><html><head><meta charset="utf-8"><title>Preview flow regression</title></head><body><div id="app"></div>
<script type="module">
import { createApp, h, ref } from 'vue'
import ElementPlus from 'element-plus'
import 'element-plus/dist/index.css'
import '../src/styles/main.scss'
import PreviewPageStack from '../src/components/PreviewPageStack.vue'

// This fixture is entirely in memory. It never writes to a project or calls AI.
const html = id => `<!doctype html><html><head><style>body{margin:0;background:#f8f5fc;font:16px system-ui}header{height:60px}main{height:610px;background:${id===1?'#ede9fe':'#e0f2fe'};padding:20px}nav{position:fixed;bottom:0;background:white;width:100%;height:60px}button{padding:14px}input{display:block}</style></head><body><div data-wf-chrome="status">08:30</div><header>共享页头</header><main><h1>Page ${id}</h1><input placeholder="保留输入"><button data-nav="${id===1?2:1}" data-wf-uid="peer">切换栏目</button><button data-action="back">返回</button><button data-modal="test">本页弹窗</button><div id="wf-modal-test" role="dialog" class="wf-modal"><button data-action="close">关闭弹窗</button></div></main><nav data-wf-navigation="bar">固定导航栏</nav><script>${id===3?'const started=Date.now();while(Date.now()-started<650){}':''}</scr${'ipt'}></body></html>`
const pages = Array.from({length:10},(_,i)=>({id:i+1,name:'Page '+(i+1),canvas_width:375,canvas_height:833,html_content:html(i+1),elements:[],annotations:[],analyzed:1}))
const chosen=ref(pages[0]), direction=ref('tab'), stack=ref(), events=[], history=[]
function choose(id, type='tab') { if(chosen.value.id!==id){if(type==='forward')history.push(chosen.value.id);direction.value=type;chosen.value=pages.find(p=>p.id===id)} }
window.previewTest={choose,pages,events,get stack(){return stack.value},get current(){return chosen.value.id},get history(){return history}}
createApp({setup:()=>()=>h('main',[
  h('button',{id:'one',onClick:()=>choose(1)},'栏目1'),h('button',{id:'two',onClick:()=>choose(2)},'栏目2'),
  h('button',{id:'slow',onClick:()=>choose(3,'forward')},'慢速详情'),
  h('div',{style:'position:relative;width:375px;height:833px;overflow:hidden;border:2px solid #999'},h(PreviewPageStack,{
    ref:stack,page:chosen.value,allPages:pages,transition:direction.value,
    onNavigate:id=>choose(Number(id)),onBack:()=>choose(history.pop()||1,'backward'),
    onDisplayPage:p=>events.push({id:p.id,time:performance.now()}),
  }))
])}).use(ElementPlus).mount('#app')
</script></body></html>
