<!doctype html><html><head><meta charset="utf-8"><title>Navigation regression harness</title></head><body><div id="app"></div>
<script type="module">
import { createApp, h, ref } from 'vue'
import ElementPlus from 'element-plus'
import 'element-plus/dist/index.css'
import 'element-plus/theme-chalk/dark/css-vars.css'
import '@fontsource/inter/latin-400.css'
import '@fontsource/inter/latin-500.css'
import '@fontsource/inter/latin-600.css'
import '../src/styles/main.scss'
import PageCanvas from '../src/components/PageCanvas.vue'
import ReviewDialog from '../src/components/AutowireReviewDialog.vue'

const html = await (await fetch('/__navigation_fixture')).text()
const base = (id, patch = {}) => ({ id, category: 'add', pageId: 1, pageName: '首页', elementId: 20, elementLabel: '我的', interactionId: null, trigger: 'click', action: 'navigate', targetPageId: 2, targetPageName: '我的', source: 'autowire_review', reason: '确认导航目标', evidenceRefs: ['navigation:20','nav_basis:exact_name'], applicable: true, selectedByDefault: true, stableKey: '1:nav:family:' + id, decisionFingerprint: 'target-2', navigation: { familyKey: 'family', itemKey: id, label: '我的', region: 'bottom', memberElementIds: [20,21], x: 125, y: 730, width: 125, height: 76, status: 'resolved', basis: 'exact_name', previousAction: null, previousTargetPageId: null, candidateTargets: [{ id: 2, name: '我的' }, { id: 3, name: '设置' }] }, ...patch })
const makePlan = (previewId, items) => ({ previewId, projectId: 1, expiresAt: Date.now()+600000, items, exclusions: [], warnings: [], protectedCount: 1, navigationDiagnostics: [{pageId:1,pageName:'首页',label:'首页',status:'current_page',reason:'当前页导航，无需新增跨页连线'}] })
const interactive = ref(true), show = ref(false)
const plan = ref(makePlan('first', [base('checked'),base('unchecked',{elementLabel:'设置',stableKey:'1:nav:family:unchecked'})]))
const page = { id: 1, name: '首页', background_image: '', canvas_width: 375, canvas_height: 812, analyzed: 1, html_content: html, elements: [], annotations: [] }
const reviewPages = [page, ...[[2,'我的'],[3,'设置'],[4,'限时兑换商店'],[5,'兑换记录']].map(([id,name])=>({...page,id,name,elements:[]}))]
window.navTest = { navigations: [], unmapped: 0, applied: [], requests: [], edit: () => interactive.value=false, preview: () => interactive.value=true, open: () => show.value=true, unchanged: () => plan.value=makePlan('next',plan.value.items.map(i=>({...i}))), unresolvedReview: () => {
  const unknown=base('unresolved',{category:'uncertain',applicable:false,selectedByDefault:false,targetPageId:null,targetPageName:'未确定',stableKey:'1:unresolved',decisionFingerprint:'unresolved'})
  unknown.navigation={...unknown.navigation,status:'unresolved',basis:'unresolved'}
  plan.value=makePlan('unresolved',[unknown])
}, ordinaryUnresolvedReview: () => {
  plan.value=makePlan('ordinary-unresolved',[base('ordinary',{navigation:null,category:'uncertain',applicable:false,selectedByDefault:false,targetPageId:null,targetPageName:'未确定',stableKey:'1:ordinary',decisionFingerprint:'ordinary-unresolved',targetSelection:{basis:'suggestion',candidateTargets:[{id:2,name:'我的'},{id:3,name:'设置'}]}})])
}, conflictReview: () => {
  const conflict=base('conflict',{category:'uncertain',applicable:false,targetPageId:null,selectedByDefault:false})
  conflict.navigation={...conflict.navigation,status:'conflict',basis:'conflict'}
  plan.value=makePlan('conflict',[conflict])
}, sampleReview: () => {
  const exchange=base('exchange',{category:'complete',pageId:4,pageName:'限时兑换商店',elementLabel:'兑换记录',interactionId:40,targetPageId:5,targetPageName:'兑换记录',selectedByDefault:false,stableKey:'4:exchange',decisionFingerprint:'exchange',reason:'导航入口已识别；兑换记录是项目中唯一匹配的独立页面。'})
  exchange.navigation={...exchange.navigation,label:'兑换记录',previousAction:'tab_switch',candidateTargets:[{id:5,name:'兑换记录'}]}
  const account=base('account',{category:'complete',interactionId:41,selectedByDefault:false,stableKey:'1:account',decisionFingerprint:'account',reason:'人工选择后重新预检的目标页面。'})
  account.navigation={...account.navigation,basis:'user_choice',previousAction:'navigate',previousTargetPageId:3}
  plan.value=makePlan('sample',[exchange,account])
} }
function recompute(request) {
  window.navTest.requests.push(request)
  plan.value=makePlan('chosen-'+window.navTest.requests.length,plan.value.items.map(i=> {
    const choice=[...(request.navigationResolutions||[]),...(request.targetResolutions||[])].find(c=>c.stableKey===i.stableKey)
    return choice ? { ...i, applicable:true, category:i.interactionId == null ? 'add':'complete', targetPageId: choice.targetPageId, targetPageName: choice.targetPageId===3?'设置':'我的', decisionFingerprint: 'choice-'+choice.targetPageId, selectedByDefault: false, navigation: i.navigation ? { ...i.navigation, status:'resolved', basis:'user_choice' } : null, targetSelection:i.targetSelection ? {...i.targetSelection,basis:'user_choice'} : null } : { ...i }
  }))
}
createApp({ setup: () => () => h('main', [
  h('p', '真实 PageCanvas iframe 与审核弹窗回归夹具'),
  h(PageCanvas,{ page, boxW:375, interactive:interactive.value, showDesign:false, showAnnotations:false, allPages:[page], onNavigate:name=>window.navTest.navigations.push(name), onAutowireUnmapped:()=>window.navTest.unmapped++ }),
  h(ReviewDialog,{ modelValue:show.value, 'onUpdate:modelValue':v=>show.value=v, plan:plan.value, result:null, busy:false, error:'', pages:reviewPages, onRecompute:recompute, onApply:v=>window.navTest.applied.push(v) })
]) }).use(ElementPlus).mount('#app')
</script></body></html>
