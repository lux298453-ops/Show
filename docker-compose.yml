version: '3.8'

services:
  # ==========================================
  # 1. MySQL 8.0 数据库服务
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: wireforge-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wireforge_root_2026}
      MYSQL_DATABASE: wireforge
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./init.sql:/docker-entrypoint-initdb.d/02_init_data.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-wireforge_root_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. Spring Boot 后端服务
  # ==========================================
  wireforge-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wireforge-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wireforge?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wireforge_root_2026}
      SQL_INIT_MODE: never
      WIREFORGE_AUTO_ANALYZE: "false"
      PORT: 8090
      TZ: Asia/Shanghai

  # ==========================================
  # 3. Vue 3 前端 + Nginx 静态托管与反向代理
  # ==========================================
  wireforge-frontend:
    build:
      context: ./wireforge-frontend
      dockerfile: Dockerfile
    container_name: wireforge-frontend
    restart: always
    depends_on:
      - wireforge-backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai

volumes:
  mysql_data:
    name: wireforge_mysql_data
